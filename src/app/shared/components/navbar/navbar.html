<header class="navbar">
    <!-- Marca -->
    <a class="marca" routerLink="/inicio" (click)="cerrarMenu()">
        <span class="marca-logo" aria-hidden="true">
            <img src="logo-ciageser.png" class="marca-imagen" alt="" />
        </span>
        <span class="marca-texto">
            <span class="marca-fila">
                <span class="marca-nombre">CIAGESER</span>
                <span class="marca-etiqueta">Logística</span>
            </span>
            <span class="marca-sub">Gestión Integral de Transporte</span>
        </span>
    </a>

    <!-- Botón hamburguesa (solo en pantallas chicas) -->
    <button type="button" class="menu-toggle" [attr.aria-expanded]="menuAbierto()" aria-controls="navbar-contenido"
        aria-label="Abrir menú" (click)="toggleMenu()">
        <svg class="icono" viewBox="0 0 24 24">
            @if (menuAbierto()) {
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
            } @else {
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h16" />
            }
        </svg>
    </button>

    <!-- Links + acciones -->
    <div class="navbar-contenido" id="navbar-contenido" [class.abierto]="menuAbierto()">
        <nav class="pildora" aria-label="Navegación principal">
            @for (link of linksVisibles; track link.path) {
            <a class="pildora-link" [routerLink]="link.path" routerLinkActive="activo" (click)="cerrarMenu()">
                <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
                    @switch (link.icono) {
                    @case ('rutas') {
                    <circle cx="6" cy="19" r="3" />
                    <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                    <circle cx="18" cy="5" r="3" />
                    }
                    @case ('clientes') {
                    <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
                    <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
                    <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
                    <path d="M10 6h4" />
                    <path d="M10 10h4" />
                    <path d="M10 14h4" />
                    <path d="M10 18h4" />
                    }
                    @case ('servicios') {
                    <path
                        d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.84Z" />
                    <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
                    <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
                    }
                    @case ('usuarios') {
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    }
                    @case ('camiones') {
                    <path
                        d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
                    <path d="M12 22V12" />
                    <path d="m3.3 7 8.7 5 8.7-5" />
                    }
                    @case ('tareas') {
                    <path d="M6 5v11" />
                    <path d="M12 5v6" />
                    <path d="M18 5v14" />
                    }
                    }
                </svg>
                <span>{{ link.label }}</span>
            </a>
            }
        </nav>

        <div class="acciones">
            @if (inicio) {
            <a class="btn btn-inicio" [routerLink]="inicio.path" routerLinkActive="activo" (click)="cerrarMenu()">
                <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
                    <rect width="7" height="7" x="3" y="3" rx="1" />
                    <rect width="7" height="7" x="14" y="3" rx="1" />
                    <rect width="7" height="7" x="14" y="14" rx="1" />
                    <rect width="7" height="7" x="3" y="14" rx="1" />
                </svg>
                <span>{{ inicio.label }}</span>
            </a>
            }
            <button type="button" class="btn btn-logout" (click)="onLogout()">
                <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m16 17 5-5-5-5" />
                    <path d="M21 12H9" />
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                </svg>
                <span>Cerrar sesión</span>
            </button>
        </div>
    </div>
</header>

<header class="navbar">
    <a class="marca" routerLink="/inicio">CIAGESER</a>

    <nav class="links">
        @for (link of linksVisibles; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="activo">{{ link.label }}</a>
        }
        <button type="button" (click)="onLogout()" class="btn-logout">Cerrar Sesión</button>
    </nav>
</header>

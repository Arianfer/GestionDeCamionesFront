<div class="login-page">
  <!-- Imagen de fondo a pantalla completa -->
  <img class="login-fondo" src="fondo-login.png" alt="Flota de Ciageser S.A." />

  <!-- Tarjeta blanca con el formulario -->
  <div class="login-card">
    <div class="login-header">
      <h1>Bienvenido</h1>
      <p class="subtitle">Ingresá tu DNI y contraseña para acceder al sistema.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="dni">DNI</label>
        <input
          type="text"
          id="dni"
          name="dni"
          inputmode="numeric"
          autocomplete="username"
          [(ngModel)]="credentials.dni"
          placeholder="Ingresá tu DNI"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="credentials.password"
          placeholder="Los 4 últimos dígitos de tu DNI"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="isLoading" class="btn-primary">
        {{ isLoading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="separador"><span>Ciageser S.A.</span></div>

    <p class="login-ayuda">¿No podés ingresar? Consultá con la oficina.</p>
  </div>
</div>

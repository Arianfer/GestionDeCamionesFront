<div class="login-page">
  <div class="login-shell">
    <div class="login-form-panel">
      <div class="login-header">
        <h2>Sistema Ciageser S.A.</h2>
        <p class="subtitle">Ingresá tu DNI y contraseña para acceder al sistema.</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="dni">DNI (Usuario)</label>
          <input
            type="text"
            id="dni"
            name="dni"
            [(ngModel)]="credentials.dni"
            placeholder="Ej: 12345678"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña (4 últimos dígitos)</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="Ej: 5678"
            required
          />
        </div>

        @if (errorMessage) {
          <div class="error-message">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" [disabled]="isLoading" class="btn-primary">
          {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>
      </form>
    </div>

    <div class="login-hero-panel">
      <img src="fondo-login.png" alt="Flota Ciageser S.A." />
    </div>
  </div>
</div>
